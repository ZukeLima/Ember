[project]
name = "ember"
version = "0.1.0"
description = "Ember: E-commerce Metrics, Business Evaluation & Reporting: synthetic data → DuckDB → dbt → Streamlit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1,<2",
    "dbt-core>=1.9,<2",
    "dbt-duckdb>=1.9,<2",
    "streamlit>=1.40,<2",
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "pyyaml>=6,<7",
]

[project.scripts]
ember = "ember.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ember"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ember", "dashboard", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
