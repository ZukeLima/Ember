version: 2

# Contract tests. Default severity is error (critical → build fails, marts not
# published). Warnings are marked explicitly.

models:
  - name: stg_customers
    description: One row per customer; segment defaults to 'unknown'.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: signup_at
        data_tests: [not_null]
      - name: segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [consumer, business, unknown]
              config: { severity: warn }

  - name: stg_products
    description: One row per product from the latest batch that delivered it.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests: [not_null]
      - name: list_price
        data_tests: [not_null, non_negative]

  - name: stg_orders
    description: Latest snapshot per order (deterministic dedupe).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: created_at
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [completed, pending, cancelled]
              config: { severity: warn }   # unexpected but parseable → warning

  - name: stg_order_items
    description: One row per order item.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        data_tests: [positive]
      - name: unit_price
        data_tests: [not_null, non_negative]
      - name: item_amount
        data_tests: [not_null, non_negative]

  - name: stg_refunds
    description: One row per refund transaction, attached to an order item.
    columns:
      - name: refund_id
        data_tests: [unique, not_null]
      - name: order_item_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_order_items')
                field: order_item_id
      - name: refunded_at
        data_tests: [not_null]
      - name: refund_amount
        data_tests: [not_null, non_negative]
      - name: refund_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [succeeded, pending, failed]
              config: { severity: warn }

  - name: int_order_snapshots
    description: Every distinct order snapshot delivered (replays collapsed).
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: updated_at
        data_tests: [not_null]
      - name: source_sequence
        data_tests: [not_null]
